name: Pre-commit check

permissions:
  contents: read
on:
  pull_request:
  merge_group:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
      with:
        node-version: '20'
        cache: 'npm'

    - run: npm install

    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  poetry-lock-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: 3.13
    - name: Install Poetry
      run: pip install poetry
    - name: Check root poetry.lock is in sync with pyproject.toml
      run: poetry check --lock
    - name: Check e2e_tests poetry.lock is in sync with pyproject.toml
      run: cd e2e_tests && poetry check --lock
